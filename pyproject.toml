[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallel-rollouts"
version = "0.1.0"
description = "Low-overhead serial, synchronous, and multi-process rollout collection for Gymnasium"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Parallel Rollouts Contributors"}]
keywords = ["reinforcement-learning", "gymnasium", "parallelism", "rollouts", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # NumPy 2.4+ stubs use Python 3.12-only syntax; keep the Python 3.10
    # static-check target installable for all supported project interpreters.
    "numpy>=1.24,<2.4",
    "gymnasium>=0.29,<2.0",
    "typing-extensions>=4.3",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
cartpole = ["gymnasium[classic-control]>=0.29,<2.0"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
include = ["parallel_rollouts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
